<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baixaí</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">

    <img src="icons/icon-48.png" alt="" width="28" height="28">
    <h1 class="app-name">Baixaí</h1>
    <span id="theme"></span>
    <button id="open-manager" class="btn btn-quiet btn-sm" type="button">Abrir gerenciador</button>

  <main>
    <div id="banner"></div>
    <div id="add"></div>

      <h2 id="recent-title" class="section-title">Recentes</h2>
      <div id="jobs"></div>
    </section>
  </main>
  <script src="popup.js"></script>

</html>
