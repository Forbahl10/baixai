[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baixai-helper"
version = "0.1.1"
description = "Baixaí — aplicativo auxiliar local (Native Messaging) para baixar vídeos, áudios e imagens"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
dependencies = ["yt-dlp[default]", "gallery-dl", "Pillow", "certifi"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[tool.setuptools.packages.find]
include = ["baixai_helper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: testes de integração que dependem de rede e das plataformas (use -m live)"]
addopts = "-m 'not live'"
