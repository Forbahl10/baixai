name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-helper:
    name: Testes do helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Instalar dependências
        run: python -m pip install -e "helper[dev]"
      - name: Pytest
        run: python -m pytest helper/tests -q

  extension:
    name: Extensão (tipos, testes e pacotes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: npm install --no-audit --no-fund
      - run: python -m pip install -e "helper"
      - run: npx tsc -p extension/tsconfig.json --noEmit
      - name: Testes (inclui integração com o helper real)
        run: node scripts/test-extension.mjs
        env:
          BAIXAI_PYTHON: python
      - run: node scripts/build-extension.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: extension
          path: |
            dist/baixai-extension-*.zip
          if-no-files-found: error

  package-helper:
    name: Pacote do helper (${{ matrix.label }})
    needs: test-helper
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x86_64 }
          - { os: windows-latest, label: windows-x86_64 }
          - { os: ubuntu-latest, label: linux-x86_64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m pip install -e "helper[dev]" pillow
      - name: Empacotar (PyInstaller)
        run: python scripts/package_helper.py
      - name: Extrair o pacote gerado
        shell: python
        run: |
          import glob, tarfile, zipfile, pathlib
          pathlib.Path("smoke").mkdir(exist_ok=True)
          for f in glob.glob("dist/baixai-helper-*"):
              if f.endswith(".zip"):
                  zipfile.ZipFile(f).extractall("smoke")
              elif f.endswith(".tar.gz"):
                  tarfile.open(f).extractall("smoke")
      - name: Teste de fumaça do pacote (instala, simula o Chrome, baixa, converte, desinstala)
        shell: python
        run: |
          import glob, subprocess, sys
          pkg = glob.glob("smoke/baixai-helper-*")[0]
          sys.exit(subprocess.call([sys.executable, "scripts/smoke_package.py", pkg]))
      - uses: actions/upload-artifact@v5
        with:
          name: helper-${{ matrix.label }}
          path: |
            dist/baixai-helper-*.tar.gz
            dist/baixai-helper-*.zip
          if-no-files-found: error

  release:
    name: Release no GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extension, package-helper]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { path: artifacts, merge-multiple: true }
      - name: Código-fonte e checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out && cp artifacts/* out/
          git archive --format=tar.gz --prefix="baixai-${VERSION}/" -o "out/baixai-source-${VERSION}.tar.gz" "$GITHUB_SHA"
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Baixaí ${GITHUB_REF_NAME} (pré-lançamento)" \
            --notes-file docs/RELEASE_NOTES.md --verify-tag
